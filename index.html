  for(const k of KEYS){const i=REQ[k].map(n=>heads.indexOf(n)).find(i=>i>=0);if(i==null){if(k!=='k')missing.push(LBL[k])}else idx[k]=i}
  if(missing.length)throw new Error('Faltan columnas requeridas: '+missing.join(', ')+'.');
  const rows=[];
  for(const r of aoa.slice(hi+1)){
    if(!r||!txt(r[idx.c]))continue;
    const o={};for(const k of KEYS)o[k]=['n1','r1','n2','r2','nm','rm'].includes(k)?num(r[idx[k]]):txt(r[idx[k]]);
    o.t=norm(o.t);o.k=norm(o.k);rows.push(o);
  }
  if(!rows.length)throw new Error('El archivo no contiene registros.');
  return rows;
}

/* ---------- Cálculo: suma realizado / suma a realizar (nunca promedio de %) ---------- */
const S=(rows,n,r)=>{let a=0,b=0,k=0;for(const x of rows)if(x[n]!=null&&x[r]!=null){a+=x[n];b+=x[r];k++}return {n:k?a:null,r:k?b:null,p:k&&a>0?b/a:null}};
const group=(rows,keys)=>{const m=new Map();rows.forEach(r=>{const k=keys.map(x=>r[x]).join('|');if(!m.has(k))m.set(k,{rows:[]});const g=m.get(k);keys.forEach(x=>g[x]=r[x]);g.rows.push(r)});return[...m.values()].map(g=>({...g,q1:S(g.rows,'n1','r1'),q2:S(g.rows,'n2','r2'),m:S(g.rows,'nm','rm')}))};
const sem=(p,t)=>{if(p==null)return null;const[g,y]=t==='CALLBACK'?[.7,.5]:[.9,.7];return p>=g?'g':p>=y?'y':'r'};
const fp=p=>p==null?'—':(Math.round(p*1000)/10).toString().replace('.',',')+'%';
const fn=v=>v==null?'—':v.toLocaleString('es-PE');
const uniq=(a,f)=>[...new Set(a.map(f).filter(Boolean))];
const match=(r,f,skip=[])=>['y','m','c','h','t'].every(k=>skip.includes(k)||!f[k]||String(r[k])===f[k]);

/* ---------- UI base ---------- */
const Pct=({p,t,cls=''})=>{const s=sem(p,t),c=s&&C[s];return <span className={'inline-flex items-center gap-1.5 font-bold tabular-nums '+cls} style={{color:c?c.tx:'#94a3b8'}}>{c&&<i className="w-2 h-2 rounded-full inline-block" style={{background:c.bar}}/>}{fp(p)}</span>};
const Bar=({p,t,h=6})=>{const s=sem(p,t);return <div className="rounded-full bg-slate-100 overflow-hidden" style={{height:h}}><div className="h-full rounded-full" style={{width:p==null?0:Math.min(100,p*100)+'%',background:s?C[s].bar:'#cbd5e1'}}/></div>};
const Sel=({label,v,set,opts})=><label className="flex flex-col gap-1 text-xs text-slate-500 font-semibold min-w-[8.5rem] flex-1">{label}<select value={v} onChange={e=>set(e.target.value)} className="h-10 rounded-xl border border-slate-200 bg-white px-3 text-sm font-medium text-slate-800 focus:outline-none focus:ring-2 focus:ring-entel/40"><option value="">Todos</option>{opts.map(o=><option key={o}>{o}</option>)}</select></label>;
const Title=({children,right})=><div className="flex flex-wrap items-center justify-between gap-3 mb-4"><h2 className="text-lg font-extrabold tracking-tight">{children}</h2>{right}</div>;
const Seg=({v,set,opts})=><div className="inline-flex p-1 rounded-xl bg-slate-100 text-sm font-semibold">{opts.map(([k,l])=><button key={k} onClick={()=>set(k)} className={'px-3 py-1.5 rounded-lg transition '+(v===k?'bg-white text-entel shadow-sm':'text-slate-500 hover:text-slate-800')}>{l}</button>)}</div>;
const ICON={'CALLBACK':'M4 5a2 2 0 012-2h2l1.5 4-2 1.2a11 11 0 005.3 5.3L14 11.5 18 13v2a2 2 0 01-2 2C9.4 17 3 10.6 3 4z','COACHING GRUPAL':'M9 8a3 3 0 100-6 3 3 0 000 6zm7 1a2.5 2.5 0 100-5 2.5 2.5 0 000 5zM3 17c0-3 2.7-5 6-5s6 2 6 5zm11-4.5c2.6 0 5 1.6 5 4.5h-3.5','COACHING INDIVIDUAL':'M10 9a3.5 3.5 0 100-7 3.5 3.5 0 000 7zM3.5 18c0-3.6 3-6 6.5-6s6.5 2.4 6.5 6z'};
const NOM={'CALLBACK':'Callback','COACHING GRUPAL':'Coaching grupal','COACHING INDIVIDUAL':'Coaching individual'};

/* ---------- Resumen ---------- */
function KpiCard({t,rows}){
  const g=useMemo(()=>({q1:S(rows,'n1','r1'),q2:S(rows,'n2','r2'),m:S(rows,'nm','rm')}),[rows]);
  const s=sem(g.m.p,t);
  return <div className="card p-5 flex flex-col gap-4 relative overflow-hidden">
    <div className="absolute left-0 top-0 bottom-0 w-1" style={{background:s?C[s].bar:'#e2e8f0'}}/>
    <div className="flex items-center gap-2.5 text-entel"><svg viewBox="0 0 20 20" className="w-5 h-5" fill="currentColor"><path d={ICON[t]}/></svg><span className="font-extrabold text-slate-900">{NOM[t]}</span></div>
    <div><div className="text-xs font-semibold text-slate-500 mb-1">Cumplimiento mensual</div>
      <Pct p={g.m.p} t={t} cls="text-5xl tracking-tight"/><div className="mt-3"><Bar p={g.m.p} t={t} h={8}/></div></div>
    {t!=='CALLBACK'&&<div className="grid grid-cols-2 gap-3">{[['Q1',g.q1],['Q2',g.q2]].map(([l,x])=><div key={l} className="rounded-xl bg-slate-50 px-3 py-2"><div className="text-xs font-semibold text-slate-500">{l}</div><Pct p={x.p} t={t} cls="text-xl"/></div>)}</div>}
    <div className="flex justify-between text-sm border-t border-slate-100 pt-3"><span className="text-slate-500">Realizado <b className="text-slate-900 tabular-nums">{fn(g.m.r)}</b></span><span className="text-slate-500">Meta <b className="text-slate-900 tabular-nums">{fn(g.m.n)}</b></span></div>
  </div>;
}

/* ---------- Cumplimiento por centro ---------- */
function CentrosChart({rows}){
  const [t,setT]=useState('COACHING GRUPAL'),[mt,setMt]=useState('m');
  const cb=t==='CALLBACK',met=cb?'m':mt,thr=(cb?.7:.9)*100;
  const data=useMemo(()=>group(rows.filter(r=>r.t===t),['c']).sort((a,b)=>{const x=(met==='cmp'?b.q2.p:b[met].p)??-1,y=(met==='cmp'?a.q2.p:a[met].p)??-1;return x-y}),[rows,t,met]);
  const low=data.filter(d=>(met==='cmp'?d.m:d[met]).p!=null).slice(-1)[0];
  const series=met==='cmp'?[['Q1','q1'],['Q2','q2']]:[['','m'===met?'m':met]];
  return <div className="card p-5">
    <Title right={<div className="flex flex-wrap gap-2"><Seg v={t} set={setT} opts={TIPOS.map(x=>[x,NOM[x]])}/>{!cb&&<Seg v={mt} set={setMt} opts={[['q1','Q1'],['q2','Q2'],['m','Mensual'],['cmp','Q1 vs Q2']]}/>}</div>}>Cumplimiento por Centro</Title>
    {!data.length?<p className="text-sm text-slate-500 py-8 text-center">Sin datos para esta selección.</p>:
    <div className="space-y-4">{data.map(d=><div key={d.c} className="grid grid-cols-[7.5rem_1fr] sm:grid-cols-[10rem_1fr] items-center gap-3">
      <div className="text-sm font-bold leading-tight">{d.c}{low&&low.c===d.c&&data.length>1&&<div className="text-xs font-semibold" style={{color:C.r.tx}}>Menor cumplimiento</div>}</div>
      <div className="space-y-1.5 relative">{series.map(([l,k])=>{const x=d[k];const s=sem(x.p,t);return <div key={k} className="flex items-center gap-3">
        {l&&<span className="w-6 text-xs font-semibold text-slate-400">{l}</span>}
        <div className="flex-1 h-6 rounded-lg bg-slate-100 relative overflow-hidden"><div className="h-full rounded-lg transition-all" style={{width:x.p==null?0:Math.min(100,x.p*100)+'%',background:s?C[s].bar:'#cbd5e1'}}/><div className="absolute top-0 bottom-0 border-l border-dashed border-slate-400/70" style={{left:thr+'%'}}/></div>
        <span className="w-16 text-right"><Pct p={x.p} t={t}/></span></div>})}</div></div>)}
      <div className="text-xs text-slate-400 pt-1">La línea punteada marca el umbral verde ({thr}%).</div></div>}
  </div>;
}

/* ---------- Detalle por habilidad ---------- */
function Habilidades({rows}){
  const [c,setC]=useState(''),[k,setK]=useState(''),[t,setT]=useState('COACHING GRUPAL');
  const cb=t==='CALLBACK',tr=rows.filter(r=>r.t===t);
  const cs=uniq(tr,r=>r.c).sort(),cc=cs.includes(c)?c:'';
  const ks=uniq(tr.filter(r=>!cc||r.c===cc),r=>r.k).sort(),kk=ks.includes(k)?k:'';
  const base=useMemo(()=>tr.filter(r=>(!cc||r.c===cc)&&(!kk||r.k===kk)),[rows,t,cc,kk]);
  const data=useMemo(()=>group(base,['c','k','h']).sort((a,b)=>(a.m.p??2)-(b.m.p??2)),[base]);
  const tot=S(base,'nm','rm');
  const below=data.filter(d=>{const s=sem(d.m.p,t);return s&&s!=='g'}).length;
  const heads=['Centro','Canal','Habilidad',...(cb?[]:['Q1','Q2']),'Mensual','A realizar','Realizado'];
  return <div className="card p-5">
    <Title right={<Seg v={t} set={setT} opts={TIPOS.map(x=>[x,NOM[x]])}/>}>Detalle por Habilidad</Title>
    <div className="flex flex-wrap items-end gap-3 mb-4"><div className="w-48"><Sel label="Centro" v={cc} set={setC} opts={cs}/></div><div className="w-48"><Sel label="Canal" v={kk} set={setK} opts={ks}/></div>
      <div className="ml-auto text-sm text-slate-500 flex items-center gap-4"><span>Mensual <Pct p={tot.p} t={t} cls="text-base"/></span><span><b className="text-slate-900">{below}</b> de {data.length} por debajo del objetivo</span></div></div>
    {!data.length?<p className="text-sm text-slate-500 py-8 text-center">Sin datos para esta selección.</p>:
    <div className="overflow-x-auto"><table className="w-full text-sm"><thead><tr className="text-left text-xs text-slate-500 border-b border-slate-100">{heads.map((h,i)=><th key={h} className={'py-2 px-3 font-semibold '+(i>=3?'text-right':'')}>{h}</th>)}</tr></thead>
    <tbody>{data.map((d,i)=><tr key={i} className="border-b border-slate-50 hover:bg-slate-50/70">
      <td className="py-2.5 px-3 text-slate-500">{d.c}</td><td className="py-2.5 px-3 text-slate-500">{d.k||'—'}</td><td className="py-2.5 px-3 font-bold">{d.h}</td>
      {!cb&&<><td className="px-3 text-right"><Pct p={d.q1.p} t={t}/></td><td className="px-3 text-right"><Pct p={d.q2.p} t={t}/></td></>}
      <td className="px-3 w-44"><div className="flex items-center gap-2"><div className="flex-1"><Bar p={d.m.p} t={t}/></div><Pct p={d.m.p} t={t} cls="w-14 justify-end"/></div></td>
      <td className="px-3 text-right tabular-nums">{fn(d.m.n)}</td><td className="px-3 text-right tabular-nums">{fn(d.m.r)}</td></tr>)}</tbody></table></div>}
  </div>;
}

/* ---------- Tabla completa ---------- */
const COLS=[['c','Centro',g=>g.c,0],['k','Canal',g=>g.k||'—',0],['h','Habilidad',g=>g.h,0],['t','Tipo CX',g=>NOM[g.t]||g.t,0],['n1','Q1 a realizar',g=>g.q1.n],['r1','Q1 realizado',g=>g.q1.r],['p1','% Q1',g=>g.q1.p,1],['n2','Q2 a realizar',g=>g.q2.n],['r2','Q2 realizado',g=>g.q2.r],['p2','% Q2',g=>g.q2.p,1],['nm','Mensual a realizar',g=>g.m.n],['rm','Mensual realizado',g=>g.m.r],['pm','% Mensual',g=>g.m.p,1]];
function Tabla({rows}){
  const [q,setQ]=useState(''),[low,setLow]=useState(false),[sort,setSort]=useState({k:'pm',d:1});
  const data=useMemo(()=>{
    let d=group(rows,['c','k','h','t']);
    if(q)d=d.filter(g=>norm(g.c+' '+g.k+' '+g.h+' '+g.t).includes(norm(q)));
    if(low)d=d.filter(g=>{const s=sem(g.m.p,g.t);return s&&s!=='g'});
    const col=COLS.find(c=>c[0]===sort.k);
    return d.sort((a,b)=>{const x=col[2](a),y=col[2](b);if(x==null&&y==null)return 0;if(x==null)return 1;if(y==null)return -1;return(typeof x==='string'?x.localeCompare(y):x-y)*sort.d});
  },[rows,q,low,sort]);
  return <div className="card p-5">
    <Title right={<div className="flex flex-wrap items-center gap-3"><label className="flex items-center gap-2 text-sm font-semibold text-slate-600"><input type="checkbox" checked={low} onChange={e=>setLow(e.target.checked)} className="accent-[#005bfd] w-4 h-4"/>Solo bajo objetivo</label><input value={q} onChange={e=>setQ(e.target.value)} placeholder="Buscar centro o habilidad" className="h-10 w-56 rounded-xl border border-slate-200 px-3 text-sm focus:outline-none focus:ring-2 focus:ring-entel/40"/></div>}>Tabla detallada</Title>
    <div className="overflow-auto max-h-[32rem] rounded-xl border border-slate-100"><table className="w-full text-sm">
      <thead className="sticky top-0 bg-slate-50 z-10"><tr>{COLS.map(([k,l,,p])=><th key={k} onClick={()=>setSort(s=>({k,d:s.k===k?-s.d:1}))} className={'py-2.5 px-3 text-xs font-semibold text-slate-500 cursor-pointer select-none hover:text-entel '+(k==='c'||k==='k'||k==='h'||k==='t'?'text-left':'text-right')}>{l}{sort.k===k?(sort.d>0?' ↑':' ↓'):''}</th>)}</tr></thead>
      <tbody>{data.map((g,i)=><tr key={i} className="border-t border-slate-100 hover:bg-slate-50/70">{COLS.map(([k,,get,p])=>{const v=get(g),cb=g.t==='CALLBACK';const isTxt=typeof v==='string';return <td key={k} className={'py-2 px-3 whitespace-nowrap '+(isTxt?(k==='h'?'font-bold':'text-slate-600'):'text-right tabular-nums')}>{isTxt?v:p?<Pct p={v} t={g.t}/>:fn(v)}</td>})}</tr>)}
      {!data.length&&<tr><td colSpan={13} className="py-8 text-center text-slate-500">Sin resultados.</td></tr>}</tbody></table></div>
    <div className="text-xs text-slate-400 mt-2">{data.length} filas · Los guiones indican que no hay información o que el indicador no aplica.</div>
  </div>;
}

/* ---------- App ---------- */
function App(){
  const [rows,setRows]=useState(()=>fromRaw(RAW.rows)),[file,setFile]=useState(RAW.name),[err,setErr]=useState('');
  const [f,setFl]=useState({y:'',m:'',c:'',h:'',t:''});
  const setF=(k,v)=>setFl(o=>{const n={...o,[k]:v};if(k==='c'&&v&&n.h&&!rows.some(r=>r.c===v&&r.h===n.h))n.h='';return n});
  const load=e=>{
    const fl=e.target.files[0];if(!fl)return;
    const rd=new FileReader();
    rd.onload=ev=>{try{
      const wb=XLSX.read(ev.target.result,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames.includes('BASE')?'BASE':wb.SheetNames[0]];
      const r=parseSheet(XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null}));
      setRows(r);setFile(fl.name);setErr('');setFl({y:'',m:'',c:'',h:'',t:''});
    }catch(x){setErr(x.message)}};
    rd.readAsArrayBuffer(fl);e.target.value='';
  };
  const ord=a=>[...a].sort((x,y)=>{const i=MESES.indexOf(norm(x)),j=MESES.indexOf(norm(y));return i>=0&&j>=0?i-j:String(x).localeCompare(String(y))});
  const opt={y:uniq(rows,r=>String(r.y)).sort(),m:ord(uniq(rows,r=>r.m)),c:uniq(rows,r=>r.c).sort(),h:uniq(rows.filter(r=>!f.c||r.c===f.c),r=>r.h).sort(),t:TIPOS.filter(t=>rows.some(r=>r.t===t))};
  const fRows=useMemo(()=>rows.filter(r=>match(r,f)),[rows,f]);
  const cmpRows=useMemo(()=>rows.filter(r=>match(r,f,['c','t'])),[rows,f]);
  const any=Object.values(f).some(Boolean);
  return <div className="min-h-screen">
    <header className="bg-entel text-white"><div className="max-w-7xl mx-auto px-5 h-16 flex items-center justify-between">
      <h1 className="text-2xl font-extrabold tracking-tight">Sistema CX</h1>
      <div className="flex items-center gap-3 text-sm"><span className="hidden sm:inline text-white/70 truncate max-w-[14rem]">{file}</span>
        <label className="cursor-pointer rounded-xl border border-white/40 hover:bg-white/15 px-3.5 py-1.5 font-semibold transition">Cargar base<input type="file" accept=".xlsx,.xls" className="hidden" onChange={load}/></label></div></div>
      <div className="h-1 bg-gradient-to-r from-[#00fdaa] via-[#005bfd] to-[#fd3d01] opacity-90"/></header>
    <main className="max-w-7xl mx-auto px-5 py-5 space-y-5">
      {err&&<div role="alert" className="rounded-xl px-4 py-3 text-sm font-semibold flex justify-between" style={{background:'#ffece6',color:'#c73000'}}><span>{err}</span><button onClick={()=>setErr('')} aria-label="Cerrar">✕</button></div>}
      <div className="card p-4 flex flex-wrap items-end gap-3 sticky top-0 z-20">
        <Sel label="Año" v={f.y} set={v=>setF('y',v)} opts={opt.y}/><Sel label="Mes" v={f.m} set={v=>setF('m',v)} opts={opt.m}/>
        <Sel label="Centro" v={f.c} set={v=>setF('c',v)} opts={opt.c}/><Sel label="Habilidad" v={f.h} set={v=>setF('h',v)} opts={opt.h}/>
        <label className="flex flex-col gap-1 text-xs text-slate-500 font-semibold min-w-[8.5rem] flex-1">Tipo CX<select value={f.t} onChange={e=>setF('t',e.target.value)} className="h-10 rounded-xl border border-slate-200 bg-white px-3 text-sm font-medium text-slate-800 focus:outline-none focus:ring-2 focus:ring-entel/40"><option value="">Todos</option>{opt.t.map(t=><option key={t} value={t}>{NOM[t]}</option>)}</select></label>
        <button onClick={()=>setFl({y:'',m:'',c:'',h:'',t:''})} disabled={!any} className="h-10 px-4 rounded-xl text-sm font-bold text-entel border border-entel/30 hover:bg-entel/5 disabled:opacity-40 disabled:cursor-default">Limpiar filtros</button>
      </div>
      <section className="grid gap-5 md:grid-cols-3">{TIPOS.map(t=><KpiCard key={t} t={t} rows={fRows.filter(r=>r.t===t)}/>)}</section>
      <CentrosChart rows={cmpRows}/>
      <Habilidades rows={fRows}/>
      <Tabla rows={fRows}/>
    </main></div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
